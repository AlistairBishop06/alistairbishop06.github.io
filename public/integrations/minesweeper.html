<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,user-scalable=no">
    <title>Minesweeper</title>
    <base href="https://98.js.org/programs/minesweeper/">
    <link href="../../lib/os-gui/layout.css" rel="stylesheet">
    <link href="../../lib/os-gui/windows-98.css" rel="stylesheet">
    <script src="../../lib/os-gui/MenuBar.js"></script>
    <script src="../../lib/jquery.min.js"></script>
    <script src="../../lib/os-gui/$Window.js"></script>
    <script src="../../src/msgbox.js"></script>
    <script>defaultMessageBoxTitle = "Minesweeper";</script>
    <script src="lib/rocket.12.06.js"></script>
    <script src="lib/seedrandom.js"></script>
    <script src="lib/konami.js"></script>
    <script src="menus.js"></script>
    <script src="minesweeper.js"></script>
    <script src="tile.js"></script>
    <script src="face.js"></script>
    <script src="grid.js"></script>
    <script src="ssd.js"></script>
    <script src="fun.js"></script>
    <style>
      html, body, #play_area { margin: 0; padding: 0; overflow: hidden; background: #bdbdbd; }
      * { image-rendering: crisp-edges; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="play_area"></div>
    <script>
      addEventListener("DOMContentLoaded", function () {
        var originalSetDifficulty = set_difficulty;
        set_difficulty = function (difficulty) {
          originalSetDifficulty(difficulty);
          parent.postMessage({
            type: "xp-minesweeper-resize",
            innerWidth: 24 + 16 * difficulty[0],
            innerHeight: 80 + 16 * difficulty[1]
          }, "*");
        };
        parent.postMessage({ type: "xp-minesweeper-resize", innerWidth: 280, innerHeight: 336 }, "*");
      });
    </script>
  </body>
</html>
